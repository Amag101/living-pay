<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Pay</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 28px 24px 48px; max-width: 1240px; margin: 0 auto; align-items: start; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .head h1 { font-size: 26px; margin: 0; }
  .toast { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px 16px; }
  .stat .l { font-size: 13.5px; color: var(--ink-2); }
  .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .who { font-weight: 600; overflow-wrap: anywhere; }
  .row .sub { color: var(--ink-3); font-size: 13.5px; overflow-wrap: anywhere; }
  .row .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .acts button, .row .acts .button { min-height: 34px; padding: 4px 11px; font-size: 13.5px; }
  .empty { padding: 44px 20px; text-align: center; }
  .empty h2 { font-size: 18px; margin: 0 0 4px; }
  .empty p { color: var(--ink-2); margin: 0 0 16px; }

  details.more { margin-top: 18px; }
  details.more > summary { cursor: pointer; color: var(--ink-2); font-weight: 550; padding: 6px 2px; width: fit-content; }
  .more-body { display: grid; gap: 14px; margin-top: 8px; }
  .more-body h3 { font-size: 14px; margin: 0; padding: 12px 16px 0; }
  .more-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; }
  .mail { padding: 12px 16px; border-top: 1px solid var(--line); }
  .mail .body { white-space: pre-wrap; color: var(--ink-2); font-size: 13.5px; margin-top: 4px; overflow-wrap: anywhere; }
  .more-body td .button, .more-body td button { min-height: 34px; padding: 4px 11px; font-size: 13.5px; }

  .assistant { position: sticky; top: 16px; display: flex; flex-direction: column; height: calc(100vh - 100px); min-height: 480px; max-height: 760px; overflow: hidden; }
  .a-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .a-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .thread { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .bubble { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); align-self: flex-start; }
  .bubble.owner { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
  .bubble.ask { border-color: var(--accent); }
  .bubble blockquote { margin: 6px 0; padding: 4px 8px; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 13px; white-space: pre-wrap; }
  .bubble em { color: var(--ink-3); font-size: 13px; font-style: normal; }
  .btnrow { display: flex; gap: 6px; margin-top: 8px; }
  .btnrow button { flex: 1; min-height: 38px; }
  .btnrow button:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btnrow button.undo { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .done { margin-top: 6px; }
  .chips { display: flex; gap: 6px; padding: 10px 12px 0; }
  .chips button { border-radius: 999px; font-size: 13px; min-height: 32px; padding: 2px 12px; }
  .composer { display: flex; gap: 8px; padding: 10px 12px 12px; }

  dialog { border: none; padding: 0; border-radius: 16px; width: min(520px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15, 22, 18, .45); }
  .d-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 4px; }
  .d-head h2 { font-size: 19px; margin: 0; }
  #invform { display: grid; gap: 14px; padding: 12px 20px 20px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #invform details summary { cursor: pointer; color: var(--ink-2); font-weight: 550; }
  #invform details[open] > div { display: grid; gap: 12px; margin-top: 12px; }
  .sent { padding: 8px 20px 20px; display: grid; gap: 12px; }
  .sent .link { display: flex; gap: 8px; }
  .sent .link input { flex: 1; min-width: 0; font-size: 13px; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 18px 16px 40px; }
    .assistant { position: static; height: 560px; }
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; }
    .stat { display: flex; justify-content: space-between; align-items: center; }
    .two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="26" height="26">Living Pay</a>
  <nav class="mainnav" aria-label="Main">
    <a href="/" aria-current="page">Invoices</a>
    <a href="/ledger">Ledger</a>
    <a href="/audit">Settings</a>
  </nav>
</header>

<main class="layout">
  <section aria-label="Invoices">
    <div class="head">
      <h1>Invoices</h1>
      <button class="primary" id="newinv">New invoice</button>
    </div>
    <div class="toast" id="toast" role="alert" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="card" id="list"></div>

    <details class="more" id="more">
      <summary>More</summary>
      <div class="more-body">
        <div class="card" id="clock" hidden>
          <div class="more-actions">
            <div style="flex:1;min-width:180px"><div class="faint">Practice clock</div><strong id="now">…</strong></div>
            <button data-advance="24">+1 day</button>
            <button data-advance="168">+1 week</button>
          </div>
        </div>
        <div class="card" id="jobs" hidden></div>
        <div class="card" id="emails"></div>
        <div><button class="ghost" id="reset">Start over with fresh data</button></div>
      </div>
    </details>
  </section>

  <section class="card assistant" aria-label="Assistant">
    <div class="a-head"><h2>Assistant</h2><span class="pill warn" id="pending" hidden></span></div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="chips">
      <button type="button" id="askpaypal" data-say="Who hasn't paid yet?" hidden>Who hasn't paid?</button>
          <button data-say="rules">My rules</button>
      <button data-say="summary">Summary</button>
      <button data-say="help">Help</button>
    </div>
    <form class="composer" id="composer">
      <input id="msg" autocomplete="off" placeholder="Type a message" aria-label="Message your assistant">
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
</main>

<dialog id="invdialog" aria-labelledby="invtitle">
  <div class="d-head">
    <h2 id="invtitle">New invoice</h2>
    <button class="ghost" id="closeinv" aria-label="Close">Close</button>
  </div>
  <form id="invform">
    <label>Who is it for?<select name="contact_id" id="invclient"></select></label>
    <div class="two newclient" hidden>
      <label>Name<input name="new_name" autocomplete="off"></label>
      <label>Email<input name="new_email" type="email" autocomplete="off"></label>
    </div>
    <label>What is it for?<input name="title" required maxlength="200" placeholder="Logo design"></label>
    <div class="two">
      <label>Amount<input name="amount" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="500"></label>
      <label>Due in<select name="due_days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select></label>
    </div>
    <details>
      <summary>Share it with a subcontractor (optional)</summary>
      <div>
        <div class="two">
          <label>Their share<input name="sub_share" type="number" min="0" step="0.01" value="0"></label>
          <label>Paid to<select name="sub_id" id="invsub"></select></label>
        </div>
        <div class="two newsub" hidden>
          <label>Name<input name="new_sub_name" autocomplete="off"></label>
          <label>PayPal email<input name="new_sub_email" type="email" autocomplete="off"></label>
        </div>
        <span class="help">Paid through PayPal once the invoice is paid in full. You'll be asked first.</span>
      </div>
    </details>
    <input type="hidden" name="new_company" value="">
    <button class="primary" type="submit">Send invoice</button>
  </form>
  <div class="sent" id="invsent" hidden>
    <p style="margin:0" id="sentmsg"></p>
    <div class="link">
      <input id="sentlink" readonly aria-label="Invoice link">
      <button id="copylink">Copy</button>
    </div>
    <span class="help">Your client can ask this invoice questions, arrange a plan and pay.</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="button" id="sentopen" target="_blank" rel="noopener">See what they see</a>
      <button class="primary" id="sentdone" style="margin-left:auto">Done</button>
    </div>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, last = "";

function money(x) {
  const v = Math.round(Number(x || 0) * 100) / 100;
  const t = Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (S ? S.currency : "$") + t;
}
const day = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const clientLink = (i) => location.origin + "/i/" + encodeURIComponent(i.token);

function md(text) {
  const lines = esc(text).split("\n");
  let out = "", quote = [];
  const flush = () => { if (quote.length) { out += "<blockquote>" + quote.join("\n") + "</blockquote>"; quote = []; } };
  for (const line of lines) {
    if (line.startsWith("&gt; ")) { quote.push(line.slice(5)); continue; }
    flush();
    out += line + "<br>";
  }
  flush();
  return out.replace(/(<br>)+$/, "")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>")
    .replace(/(^|[\s(>])_(.+?)_(?=$|[\s.,)<])/g, "$1<em>$2</em>");
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) {
    showError(data.error || "Something went wrong");
    return { failed: true, state: await fetch("/api/state").then((x) => x.json()) };
  }
  return data;
}
function showError(text) {
  const t = $("#toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(showError.timer);
  showError.timer = setTimeout(() => (t.hidden = true), 7000);
}

function render(state) {
  if (state.failed) state = state.state;
  const json = JSON.stringify(state);
  if (json === last) return;
  last = json;
  S = state;
  renderStats(); renderList(); renderMore(); renderChat(); fillForm();
}

function renderStats() {
  const open = S.invoices.filter((i) => i.status === "sent");
  const tiles = [
    ["Waiting to be paid", money(open.reduce((a, i) => a + i.balance, 0))],
    ["Collected", money(S.invoices.filter((i) => i.status !== "void").reduce((a, i) => a + (i.amount_paid || 0), 0))],
    ["Needs your OK", S.pending],
  ];
  $("#stats").innerHTML = tiles.map(([l, v]) => `<div class="card stat"><div class="l">${l}</div><div class="v">${esc(v)}</div></div>`).join("");
}

function statusOf(i) {
  if (i.status === "paid") return `<span class="pill good">Paid</span>`;
  if (i.status === "void") return `<span class="pill">Cancelled</span>`;
  if (i.days_overdue > 0) return `<span class="pill warn">${i.days_overdue} ${i.days_overdue === 1 ? "day" : "days"} overdue</span>`;
  if (i.amount_paid > 0) return `<span class="pill">${money(i.balance)} left</span>`;
  return `<span class="pill">Due ${esc(day(i.due_at))}</span>`;
}

function renderList() {
  if (!S.invoices.length) {
    $("#list").innerHTML = `<div class="empty"><h2>No invoices yet</h2><p>Send your first one. It takes about a minute.</p><button class="primary" data-newinv="1">New invoice</button></div>`;
    return;
  }
  const payouts = {};
  (S.payouts || []).forEach((p) => { if (p.status !== "cancelled") payouts[p.number] = p; });
  $("#list").innerHTML = S.invoices.map((i) => {
    const paid = payouts[i.number];
    return `<div class="row">
      <div><div class="who">${esc(i.company || i.name)}</div><div class="sub">${esc(i.title || "Services")} · ${esc(i.number)}${paid ? ` · ${esc(paid.name)} paid ${money(paid.amount)}` : ""}</div></div>
      <div class="amt">${money(i.total)}</div>
      <div>${statusOf(i)}</div>
      <div class="acts">
        ${i.token ? `<a class="button" href="/i/${encodeURIComponent(i.token)}" target="_blank" rel="noopener">Open</a>
        <button data-copy="${esc(clientLink(i))}">Copy link</button>` : ""}
        ${i.status === "sent" ? `<button class="ghost" data-markpaid="${i.id}">Paid another way?</button>` : ""}
      </div>
    </div>`;
  }).join("");
}

function renderMore() {
  const practice = S.clock !== "real";
  $("#clock").hidden = !practice;
  $("#now").textContent = S.now_nice;
  const jobs = S.events.filter((e) => e.status === "scheduled" && e.amount);
  $("#jobs").hidden = !jobs.length;
  $("#jobs").innerHTML = `<h3>Jobs on your calendar</h3><table><tbody>${jobs.map((e) => `<tr>
      <td><strong>${esc(e.title)}</strong><div class="faint">${esc(e.name || "")}</div></td>
      <td class="num">${money(e.amount)}</td>
      <td class="num"><button data-act="event/complete" data-id="${e.id}">Finished: bill it</button></td></tr>`).join("")}</tbody></table>`;
  $("#emails").innerHTML = `<h3 style="padding-bottom:12px">Emails sent</h3>` + (S.outbox.length ? S.outbox.map((o) => `<div class="mail">
      <strong>${esc(o.subject || "Message")}</strong> <span class="faint">to ${esc(o.to_addr)}</span>
      <div class="body">${esc(o.body)}</div></div>`).join("") : `<div class="mail faint">Nothing yet.</div>`);
}

const STATUS_WORD = { executed: ["Done", "good"], skipped: ["Declined", ""], undone: ["Undone", ""], cancelled: ["Cancelled", ""],
  failed: ["Failed", "bad"], countered: ["Countered", ""], observed: ["Noted", ""] };

function renderChat() {
  $("#reset").hidden = !S.demo;
  $("#askpaypal").hidden = !S.ask_paypal;
  const th = $("#thread");
  const atBottom = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  th.innerHTML = S.chat.map((m) => {
    let extra = "", asking = false;
    if (m.buttons && m.buttons.length) {
      const live = m.buttons.filter((b) => (b.label === "Undo" ? m.pstatus === "executed" : m.pstatus === "pending"));
      asking = m.pstatus === "pending" && live.length > 0;
      if (live.length) {
        extra = `<div class="btnrow">${live.map((b) => `<button class="${b.label === "Undo" ? "undo" : ""}" data-say="${esc(b.send)}">${esc(b.label)}</button>`).join("")}</div>`;
      } else if (STATUS_WORD[m.pstatus] && m.buttons[0].label !== "Undo") {
        const [w, cls] = STATUS_WORD[m.pstatus];
        extra = `<div class="done"><span class="pill ${cls}">${w}</span></div>`;
      }
    }
    return `<div class="bubble ${m.sender === "owner" ? "owner" : ""} ${asking ? "ask" : ""}">${md(m.body)}${extra}</div>`;
  }).join("");
  if (atBottom || th.dataset.init !== "1") { th.scrollTop = th.scrollHeight; th.dataset.init = "1"; }
  const b = $("#pending");
  b.hidden = !S.pending;
  b.textContent = S.pending + " waiting for you";
}

async function say(text) {
  const th0 = $("#thread");
  th0.insertAdjacentHTML("beforeend", `<div class="bubble owner">${esc(text)}</div><div class="bubble">Working on it…</div>`);
  th0.scrollTop = th0.scrollHeight;
  render(await api("/api/chat", { text }));
  const th = $("#thread"); th.scrollTop = th.scrollHeight;
}

function fillForm() {
  const key = S.contacts.length + "/" + S.subcontractors.length;
  if (fillForm.key === key) return;
  fillForm.key = key;
  const c = $("#invclient"), keepC = c.value, s = $("#invsub"), keepS = s.value;
  c.innerHTML = S.contacts.map((x) => `<option value="${x.id}">${esc(x.name)}${x.company ? " · " + esc(x.company) : ""}</option>`).join("")
    + `<option value="new">+ New client</option>`;
  s.innerHTML = `<option value="">Choose…</option>` + S.subcontractors.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")
    + `<option value="new">+ New subcontractor</option>`;
  if (keepC) c.value = keepC;
  if (keepS) s.value = keepS;
  toggleExtras();
}
function toggleExtras() {
  const nc = $("#invclient").value === "new", ns = $("#invsub").value === "new";
  document.querySelector("#invform .newclient").hidden = !nc;
  document.querySelector("#invform .newsub").hidden = !ns;
  $("#invform [name=new_name]").required = nc;
  $("#invform [name=new_email]").required = nc;
  $("#invform [name=new_sub_name]").required = ns;
  $("#invform [name=new_sub_email]").required = ns;
}
$("#invclient").addEventListener("change", toggleExtras);
$("#invsub").addEventListener("change", toggleExtras);

function openInvoiceForm() {
  $("#invform").hidden = false; $("#invsent").hidden = true;
  $("#invtitle").textContent = "New invoice";
  fillForm.key = null; fillForm();
  $("#invdialog").showModal();
}
$("#closeinv").addEventListener("click", () => $("#invdialog").close());
$("#sentdone").addEventListener("click", () => $("#invdialog").close());
$("#copylink").addEventListener("click", async (e) => {
  const v = $("#sentlink").value; await copy(v, e.target);
});
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (err) { /* fall through: the link stays visible */ }
  const was = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = was), 1500);
}

$("#invform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Sending…";
  const before = S.invoices.length;
  const res = await api("/api/sandbox/invoice/new", Object.fromEntries(new FormData(e.target)));
  btn.disabled = false; btn.textContent = "Send invoice";
  render(res);
  if (res.failed) { $("#invdialog").close(); return; }
  if (S.invoices.length > before) {
    const inv = S.invoices[0];
    e.target.reset();
    $("#invform").hidden = true; $("#invsent").hidden = false;
    $("#invtitle").textContent = "Invoice sent";
    $("#sentmsg").textContent = `${inv.number} for ${money(inv.total)} is ready. Send ${inv.name} this link:`;
    $("#sentlink").value = clientLink(inv);
    $("#sentopen").href = clientLink(inv);
  }
});

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "newinv" || t.dataset.newinv) openInvoiceForm();
  else if (t.dataset.copy) copy(t.dataset.copy, t);
  else if (t.dataset.markpaid) {
    if (confirm("Mark this invoice as fully paid?\n\nOnly use this if the money reached you outside PayPal, like a bank transfer or cash. It doesn't collect anything."))
      render(await api("/api/sandbox/invoice/paid", { id: +t.dataset.markpaid }));
  }
  else if (t.dataset.advance) render(await api("/api/sandbox/clock/advance", { hours: +t.dataset.advance }));
  else if (t.dataset.act) render(await api("/api/sandbox/" + t.dataset.act, { id: +t.dataset.id }));
  else if (t.dataset.say) say(t.dataset.say);
  else if (t.id === "reset") {
    if (confirm("Delete everything here and start over?")) { last = ""; fillForm.key = null; $("#thread").dataset.init = ""; render(await api("/api/reset", {})); }
  }
});

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("#msg").value.trim();
  if (!v) return;
  $("#msg").value = "";
  say(v);
});

async function poll() { try { render(await api("/api/state")); } catch (err) { /* server restarting */ } }
poll();
setInterval(() => { if (document.visibilityState === "visible" && !$("#invdialog").open) poll(); }, 3000);
</script>
</body>
</html>
