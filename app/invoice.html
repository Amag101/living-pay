<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your invoice</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  :root { --card: var(--surface); --muted: var(--ink-2); --soft: var(--accent-soft); --warn-bg: var(--warn-soft);
          --me: var(--accent-soft); --me-ink: var(--ink); --them: var(--surface-2); --good-bg: var(--good-tint); --bad-bg: var(--bad-soft); }
  * { box-sizing: border-box; }
  body { background: linear-gradient(var(--ink), var(--ink)) no-repeat top / 100% var(--bar), var(--bg); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  header h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.022em; line-height: 1.2; }
  header .sub { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 18px 20px; }
  .pill { display: inline-block; font-size: 12px; line-height: 18px; padding: 1px 7px; border-radius: 4px; background: var(--soft);
          color: var(--accent-hover); font-weight: 600; }
  .pill.paid { background: var(--good-bg); color: var(--good); }
  .pill.void { background: var(--them); color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .k { color: var(--muted); }
  .row.big { font-size: 15px; font-weight: 600; align-items: baseline; border-top-color: var(--ink); padding-top: 12px; }
  .row.big .num { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .row .strike { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: 6px; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .pad { display: flex; flex-direction: column; }
  #invhead { order: 0; }
  .progress-text { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .progress-text strong { font-size: 30px; font-weight: 700; color: var(--ink); letter-spacing: -.025em; margin-right: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .paidrow td { color: var(--good); }
  .remind { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .remind .check { display: flex; align-items: flex-start; gap: 8px; font-weight: 500; cursor: pointer; flex: 1 1 220px; }
  .remind .check input { margin-top: 3px; accent-color: var(--accent); }
  .remind .check .note { display: block; margin-top: 0; overflow-wrap: anywhere; }
  .remind .button { background: var(--surface); }
  details.tucked summary { cursor: pointer; font-weight: 550; color: var(--ink-2); padding: 4px 0; }
  details.tucked[open] summary { margin-bottom: 6px; }
  .plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  .plan td { padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 0; }
  .plan tr:last-child td { border-bottom: 1px solid var(--line); }
  .plan td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 12px; }
  .plan td.num:empty { padding-left: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .paybox { margin-top: 0; padding: 16px 20px 20px; border-top: 1px solid var(--line); }
  .due { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-weight: 550; }
  .due strong { font-size: 34px; font-weight: 700; letter-spacing: -.028em; line-height: 1.15; }
  .choice { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .choice label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .choice label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice input { margin: 0; accent-color: var(--accent); }
  button { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card);
           color: var(--ink); padding: 9px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-size: 15px; font-weight: 600; width: 100%;
                   min-height: 46px; padding: 12px 14px; }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .error { color: #b3261e; font-size: 14px; margin-top: 8px; }
  .banner { background: var(--warn-bg); color: var(--warn); border-left: 3px solid var(--warn); border-radius: 4px; padding: 10px 12px; font-size: 13.5px; margin: 0 0 14px; }
  .chat { display: flex; flex-direction: column; height: min(620px, calc(100vh - 186px)); min-height: 420px; }
  .chat-head { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .chat-head .t { font-size: 15px; font-weight: 700; }
  .chat-head .s { color: var(--muted); font-size: 13px; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.client { max-width: 85%; align-self: flex-end; padding: 7px 11px; background: var(--me); color: var(--me-ink); border-radius: var(--radius-sm); }
  .msg.agent { align-self: stretch; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
  .paylater { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .banner.late { background: var(--bad-soft); color: var(--bad); border-left-color: var(--bad); }
  .lateword { color: var(--bad); font-weight: 600; }
  .msg.agent:last-child { border-bottom: 0; padding-bottom: 0; }
  .msg.typing { color: var(--muted); border-bottom: 0; }
  .msg.check { align-self: stretch; padding: 6px 10px; font-size: 13px; font-weight: 600; border-radius: 4px; border-left: 3px solid var(--muted); white-space: normal; background: var(--surface-2); color: var(--muted); }
  .msg.check.allow { background: var(--good-soft); color: var(--good); border-left-color: var(--good); }
  .msg.check.ask { background: var(--warn-soft); color: var(--warn); border-left-color: var(--warn); }
  .msg.check.deny { background: var(--bad-soft); color: var(--bad); border-left-color: var(--bad); }
  .brandbar { display: flex; align-items: center; gap: 10px; min-height: var(--bar); font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--on-ink); margin-bottom: 24px; }
  .brandbar img { width: 30px; height: 30px; flex: none; }
  .brandbar .env { margin-left: auto; font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: var(--on-ink-2); text-align: right; }
  .plannote { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .asklink { display: none; margin-top: 10px; font-size: 14px; }
  #paypal-buttons { min-height: 45px; }
  @media (max-width: 820px) { input, select, form.send input { font-size: 16px; } .chips button { min-height: 40px; } .asklink { display: block; } }
  @media (max-width: 560px) {
    .brandbar { font-size: 16px; gap: 8px; }
    .brandbar img { width: 26px; height: 26px; }
    header h1 { font-size: 24px; }
    .due strong { font-size: 30px; }
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--line); }
  .chips:empty { display: none; }
  .chips button { font-size: 13px; font-weight: 550; min-height: 32px; padding: 4px 10px; }
  form.send { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  form.send input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--field);
                    background: var(--surface); color: var(--ink); }
  form.send button { flex: none; }
  .empty { color: var(--muted); font-size: 14px; }
  #paypal-buttons { min-height: 45px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><img src="/logo.svg" alt="" width="24" height="24">Living Pay<span class="env" id="envnote"></span></div>
  <header>
    <h1 id="biz">Loading your invoice…</h1>
    <span class="sub" id="number"></span>
    <span id="status"></span>
  </header>
  <div id="fatal" class="error" hidden></div>
  <div class="grid" id="grid" hidden>
    <section class="card">
      <div class="pad">
        <div id="plan"></div>
        <h2 id="invhead">Invoice</h2>
        <div id="lines"></div>
      </div>
      <div class="paybox" id="paybox"></div>
    </section>
    <section class="card chat">
      <div class="chat-head">
        <div class="t">Ask this invoice</div>
        <div class="s" id="chat-sub">Questions, a payment plan or more time.</div>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="send" id="send">
        <input id="text" maxlength="1000" autocomplete="off" placeholder="Type a message…" aria-label="Message">
        <button type="submit" id="sendbtn">Send</button>
      </form>
    </section>
  </div>
  <footer id="foot"></footer>
</div>
<script>
const token = location.pathname.split("/").filter(Boolean)[1] || "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, busy = false, which = "now", paypalLoaded = false, lastChat = -1;

function cash(x) {
  const v = Math.round(Number(x) * 100) / 100;
  const s = Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (S ? S.currency : "$") + s;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch("/api/i/" + encodeURIComponent(token) + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

function render() {
  document.title = `${S.number} from ${S.business}`;
  $("#biz").textContent = S.business;
  $("#number").textContent = `Invoice ${S.number} · issued ${S.issued}`;
  const st = S.status === "paid" ? `<span class="pill paid">Paid</span>` : S.status === "refunded" ? `<span class="pill void">Refunded</span>`
    : S.status === "sent" ? `<span class="pill">${S.plan.length ? "Final payment" : "Due"} ${esc(S.due_date)}</span>` : `<span class="pill void">Cancelled</span>`;
  $("#status").innerHTML = st;
  $("#grid").hidden = false;

  const disc = S.discount_pct ? S.amount * S.discount_pct / 100 : 0;
  const rows = `
    <div class="row"><span class="k">For</span><span>${esc(S.client)}</span></div>
    <div class="row"><span class="k">Work</span><span>${esc(S.title)}</span></div>
    ${disc ? `<div class="row"><span class="k">Price</span><span class="num">${cash(S.amount)}</span></div>` : ""}
    ${disc ? `<div class="row"><span class="k">Discount (${+S.discount_pct.toFixed(1)}%)</span><span class="num">−${cash(disc)}</span></div>` : ""}
    ${disc || S.paid ? `<div class="row"><span class="k">Total</span><span class="num">${cash(S.total)}</span></div>` : ""}
    ${S.refunded ? `<div class="row"><span class="k">Refunded to you</span><span class="num">${cash(S.refunded)}</span></div>` : ""}
    ${S.paid ? `<div class="row"><span class="k">Paid so far</span><span class="num">${cash(S.paid)}</span></div>` : ""}
    <div class="row big"><span>Balance</span><span class="num">${cash(S.balance)}</span></div>
    `;
  // Once a plan is under way the same link becomes the client's plan page: progress first, details tucked away.
  const keepOpen = $("#lines details") && $("#lines details").open;
  $("#invhead").hidden = S.plan_view;
  $("#lines").innerHTML = S.plan_view ? `<details class="tucked" ${keepOpen ? "open" : ""}><summary>Invoice details</summary>${rows}</details>` : rows;
  $("#plan").innerHTML = S.plan_view ? planView() : S.plan.length ? planTable("Payment plan", "margin-top:16px") : "";
  $("#plan").style.order = S.plan_view ? "" : "1";

  renderPay();
  renderChat();
  $("#envnote").textContent = S.mode === "paypal" && S.paypal_env !== "sandbox" ? "" : "Sandbox: no real money moves";
  $("#foot").textContent = "Powered by Living Pay. " + (S.mode === "fake" ? "Demo mode: payments go to a simulated PayPal sandbox." :
    S.mode === "offline" ? "Demo mode: PayPal isn't connected, so payments are simulated." :
    S.paypal_env === "sandbox" ? "PayPal sandbox: no real money moves." : "");
}

function planTable(title, style) {
  return `<h2 style="${style || ""}">${esc(title)}</h2>
    <table class="plan">${S.plan.map((p) => `<tr class="${p.owed <= 0 ? "paidrow" : ""}"><td>${p.owed <= 0 ? "✓ " : ""}${esc(p.due)}</td><td class="num">${cash(p.amount)}</td>
      <td class="num ${p.late ? "lateword" : ""}">${p.owed <= 0 ? "Paid" : p.late ? "Late" : p.owed < p.amount ? cash(p.owed) + " left" : ""}</td></tr>`).join("")}</table>
    ${S.status === "sent" ? `<p class="plannote">Nothing is charged automatically. Come back to this link to pay each one.</p>` : ""}`;
}

function planView() {
  const pct = S.total ? Math.min(100, Math.round(S.paid / S.total * 100)) : 0;
  const done = S.status === "paid";
  return `<h2>Your payment plan</h2>
    <div class="progress-text"><strong class="num">${cash(S.paid)}</strong> paid of ${cash(S.total)}</div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Paid so far"><span style="width:${pct}%"></span></div>
    ${planTable("Schedule", "margin-top:16px")}
    ${done ? "" : `<div class="remind">
      <label class="check"><input type="checkbox" id="remindbox" ${S.remind_email ? "checked" : ""}>
        <span>Email me ${S.remind_days} days before each payment<span class="note">to ${esc(S.client_email)}</span></span></label>
      <a class="button" href="/api/i/${encodeURIComponent(token)}/calendar.ics" download>Add to calendar</a>
    </div>`}
    <div style="height:14px"></div>`;
}

function renderPay() {
  const box = $("#paybox");
  if (S.status !== "sent") {
    box.innerHTML = `<div class="due"><span>${S.status === "refunded" ? "Refunded in full." : S.status === "paid" ? "Paid in full. Thank you!" : "This invoice was cancelled."}</span></div>`;
    return;
  }
  const hasChoice = S.due_now < S.balance - 0.005;
  if (!hasChoice) which = "now";
  const amount = which === "balance" ? S.balance : S.due_now;
  // Only rebuild the payment buttons when something they show changes: not on each chat reply, and never mid-payment.
  const key = [S.status, S.mode, amount, which, hasChoice, S.late_amount, S.waiting_for_owner, S.plan.length, S.paid].join("|");
  if (key === renderPay.key && $("#paypal-buttons") && $("#paypal-buttons").childElementCount) return;
  renderPay.key = key;
  const waiting = S.waiting_for_owner ? `<div class="banner">Waiting for ${esc(S.business)} to answer your request for ${esc(S.waiting_for_owner)}. You won't get an email, so check this page again. You can still pay.</div>` : "";
  const late = S.late_amount > 0 ? `<div class="banner late">${cash(S.late_amount)} was due on ${esc(S.late_since)}. Please pay it below, or ask here for more time.</div>` : "";
  box.innerHTML = `${late}${waiting}
    <div class="due"><span>${hasChoice && which === "now" ? (S.late_amount > 0 ? "Due now" : S.due_today ? "Due today" : `Next payment, due ${esc(S.next_due)}`) : "Pay"}</span><strong class="num">${cash(amount)}</strong></div>
    ${hasChoice ? `<div class="choice">
      <label><input type="radio" name="which" value="now" ${which === "now" ? "checked" : ""}>${S.late_amount > 0 ? "What's late" : "Next payment"} (${cash(S.due_now)})</label>
      <label><input type="radio" name="which" value="balance" ${which === "balance" ? "checked" : ""}>Whole balance (${cash(S.balance)})</label></div>` : ""}
    ${!S.plan.length && !S.plan_ended && !S.paid ? `<div class="paylater"><strong>Can't pay it all today?</strong> <span id="paylater" hidden>Choose <strong>Pay Later</strong> below. If PayPal approves you, you pay PayPal over time and ${esc(S.business)} gets the full amount up front. </span>You can also ask the assistant on this page for a plan or more time.</div>` : ""}
    <div id="paypal-buttons"></div>
    <div class="error" id="payerr" hidden></div>
    ${S.payer_url && S.mode === "paypal" ? `<div class="note">Prefer PayPal's own page? <a href="${esc(S.payer_url)}" target="_blank" rel="noopener">Open this invoice on PayPal</a>.${S.plan.length ? ` PayPal shows the whole balance of ${cash(S.balance)}; the next payment is the minimum due, ${cash(S.due_now)}.` : ""}</div>` : ""}`;
  box.querySelectorAll("input[name=which]").forEach((r) => r.addEventListener("change", () => { which = r.value; renderPay(); }));

  box.insertAdjacentHTML("beforeend", `<a class="asklink" href="#text">Questions? Ask this invoice</a>`);
  const holder = $("#paypal-buttons");
  if (S.mode === "paypal") {
    holder.innerHTML = `<div class="note">Loading PayPal…</div>`;
    loadPayPal().then(() => {
      const offerable = window.paypal.isFundingEligible && window.paypal.isFundingEligible(window.paypal.FUNDING.PAYLATER);
      if ($("#paylater")) $("#paylater").hidden = !offerable;
      holder.innerHTML = "";
      window.paypal.Buttons({
        style: {layout: "vertical", shape: "rect", label: "pay"},
        createOrder: async (data) => (await api("/orders", {which, funding: data.paymentSource})).order_id,
        onApprove: async (data) => { S = await api(`/orders/${data.orderID}/capture`, {}); render(); },
        onError: (err) => payError(err && err.message ? err.message : "PayPal couldn't complete the payment."),
      }).render(holder);
    }).catch(() => payError("PayPal didn't load. Check your connection and refresh."));
  } else {
    const label = S.mode === "fake" ? `Pay ${cash(amount)} with PayPal (simulated)` : `Simulate a ${cash(amount)} payment`;
    holder.innerHTML = `<button class="primary" id="paybtn">${label}</button>`;
    $("#paybtn").addEventListener("click", payDemo);
  }
}

function loadPayPal() {
  if (paypalLoaded) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(S.paypal_client_id)}&currency=${encodeURIComponent(S.currency_code)}&intent=capture&components=buttons,funding-eligibility&enable-funding=paylater${S.paypal_env === "sandbox" ? "&buyer-country=US" : ""}`;
    s.onload = () => { paypalLoaded = true; ok(); };
    s.onerror = fail;
    document.head.appendChild(s);
  });
}

function payError(msg) { const e = $("#payerr"); if (e) { e.textContent = msg; e.hidden = false; } }

async function payDemo() {
  const b = $("#paybtn"); b.disabled = true; b.textContent = "Processing…";
  try {
    if (S.mode === "fake") {
      const {order_id} = await api("/orders", {which});
      await api(`/orders/${order_id}/fake-approve`, {});   // stands in for the buyer's PayPal popup
      S = await api(`/orders/${order_id}/capture`, {});
    } else {
      S = await api("/demo-pay", {which});
    }
    which = "now";
    render();
  } catch (e) { payError(e.message); b.disabled = false; b.textContent = "Try again"; }
}

function renderChat() {
  if (S.chat.length === lastChat && !busy) return;
  lastChat = S.chat.length;
  const m = $("#msgs");
  m.innerHTML = S.chat.length ? S.chat.map((c) => `<div class="msg ${c.role === "agent" ? "agent" : c.role} ${c.role === "check" ? (/not allowed/.test(c.body) ? "deny" : /allowed/.test(c.body) ? "allow" : "ask") : ""}">${esc(c.body)}</div>`).join("")
    : `<div class="msg agent">Hi! I'm the AI assistant on this invoice from ${esc(S.business)}. I can explain it, set up a payment plan or move the due date. What would help?</div>`;
  if (busy) m.insertAdjacentHTML("beforeend", `<div class="msg agent typing">Thinking…</div>`);
  const open = S.status === "sent" || S.status === "paid";
  $("#text").disabled = !open || busy; $("#sendbtn").disabled = !open || busy;
  // The suggestions stay available, minus any that no longer make sense for this invoice.
  const suggestions = [
    !S.plan.length && !S.plan_ended && !S.paid && "I can't pay it all today",
    !S.plan.length && !S.plan_ended && "Can I split this into 3 payments?",
    S.discount_chip && !S.discount_pct && !S.paid && "Any discount if I pay today?",
    "Could I have two more weeks?",
    "What is this invoice for?",
  ].filter(Boolean);
  $("#chips").innerHTML = open && !busy ? suggestions.map((t) => `<button type="button">${esc(t)}</button>`).join("") : "";
  $("#chips").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => send(b.textContent)));
  m.scrollTop = m.scrollHeight;  // after the chips, which change the list's height
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  S.chat = S.chat.concat([{role: "client", body: text}]);
  $("#text").value = "";
  lastChat = -1; renderChat();
  try { S = await api("/chat", {text}); }
  catch (e) { S.chat = S.chat.concat([{role: "agent", body: e.message}]); }
  busy = false; lastChat = -1; render();
  $("#text").focus();
}

$("#plan").addEventListener("change", async (e) => {
  if (e.target.id !== "remindbox") return;
  e.target.disabled = true;
  try { S = await api("/reminders", {on: e.target.checked}); render(); }
  catch (err) { refresh(); }
});

$("#send").addEventListener("submit", (e) => { e.preventDefault(); send($("#text").value); });

async function refresh() {
  try {
    const next = await api("");
    const changed = !S || JSON.stringify(next) !== JSON.stringify(S);
    S = next;
    if (changed && !busy) render();
  } catch (e) {
    if (!S) { $("#biz").textContent = "Invoice not found"; $("#fatal").textContent = e.message; $("#fatal").hidden = false; }
  }
}
refresh();
setInterval(() => { if (!busy && document.visibilityState === "visible") refresh(); }, 4000);
</script>
</body>
</html>
