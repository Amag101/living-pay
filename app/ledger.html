<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger · Living Pay</title>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33.0.3/dist/ag-grid-community.min.js"></script>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  :root { --card: var(--surface); --muted: var(--ink-2); --soft: var(--accent-soft); --warn-bg: var(--warn-tint);
          --me: var(--accent); --me-ink: var(--accent-ink); --them: var(--surface-2); --good-bg: var(--good-tint); --bad-bg: var(--bad-tint); }
  * { box-sizing: border-box; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 40px; }
  .pagehead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .pagehead h1 { font-size: 28px; font-weight: 700; letter-spacing: -.022em; line-height: 1.2; margin: 0; }
  .pagehead .sub { color: var(--muted); font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; margin-bottom: 16px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  @media (max-width: 960px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .wrap { padding: 16px 16px 32px; } }
  .kpi { background: var(--card); padding: 12px 16px; }
  .kpi .l { color: var(--muted); font-size: 12.5px; font-weight: 550; }
  .kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -.022em; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .kpi .h { color: var(--ink-3); font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar input { font: inherit; font-size: 14px; padding: 6px 10px; min-height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--field); background: var(--card);
               color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 340px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button { font: inherit; font-size: 13.5px; font-weight: 550; min-height: 34px; border: 0; border-radius: 0; background: var(--card); color: var(--ink-2); padding: 5px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover { background: var(--bg); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
  .seg button:focus-visible { outline-offset: -3px; }
  @media (max-width: 520px) { .seg button { padding: 5px 9px; font-size: 13px; } }
  .live { margin-left: auto; color: var(--muted); font-size: 12px; }
  .grid-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  #grid { height: min(620px, calc(100vh - 322px)); min-height: 360px; width: 100%; }
  .pill { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 6px; border-radius: 4px; font-weight: 600;
          background: var(--soft); color: var(--accent-hover); }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.muted { background: var(--surface-2); color: var(--muted); border: 0; }
  .neg { color: var(--bad); }
  .ag-right-aligned-cell, .ag-cell[col-id="amount"], .ag-cell[col-id="overdue"] { text-align: right; font-variant-numeric: tabular-nums; }
  .ag-cell[col-id="amount"], .ag-cell[col-id="total"], .ag-cell[col-id="paid"], .ag-cell[col-id="balance"] { font-weight: 600; }
  .ag-floating-bottom .ag-cell { font-weight: 700; }
  .ag-floating-bottom .ag-row { background: var(--bg); }
  @media (hover: hover) {
    .ag-header-cell:not(.ag-header-cell-filtered) .ag-header-cell-filter-button { opacity: 0; }
    .ag-header-cell:hover .ag-header-cell-filter-button, .ag-header-cell:focus .ag-header-cell-filter-button, .ag-header-cell:focus-within .ag-header-cell-filter-button { opacity: 1; }
  }
  .ag-cell[col-id="undo"] { display: flex; align-items: center; }
  .ag-cell[col-id="why"], .ag-header-cell[col-id="why"] { padding-left: 8px; }
  .undo { min-height: 28px; font: inherit; font-size: 12px; font-weight: 600; line-height: 18px; padding: 2px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-2);
          background: var(--card); color: var(--ink); cursor: pointer; }
  .ag-row { cursor: default; }
  .drill .ag-row { cursor: pointer; }
  .prog { display: flex; align-items: center; gap: 8px; height: 100%; }
  .prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: block; }
  .prog i b { display: block; height: 100%; background: var(--accent); }
  .prog span { font-size: 12px; color: var(--muted); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .chip { display: inline-flex; gap: 6px; align-items: center; min-height: 36px; padding: 4px 10px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-hover); font-size: 13px; font-weight: 550; }
  .chip button { min-height: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; padding: 0; }
  .export { font: inherit; font-size: 13.5px; font-weight: 600; min-height: 36px; padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--card); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/logo.svg" alt="" width="26" height="26">Living Pay</a>
  <nav class="mainnav" aria-label="Main">
    <a href="/">Invoices</a>
    <a href="/ledger" aria-current="page">Ledger</a>
    <a href="/audit">Settings</a>
  </nav>
</header>
<div class="wrap">
  <div class="pagehead"><h1 id="title">Ledger</h1><span class="sub" id="now"></span></div>
  <section class="kpis" id="kpis" aria-label="Totals"></section>
  <div class="bar">
    <div class="seg" id="views" role="group" aria-label="View">
      <button aria-pressed="true" data-v="activity">Activity</button><button aria-pressed="false" data-v="invoices">Invoices</button>
      <button aria-pressed="false" data-v="clients">Clients</button>
    </div>
    <div class="seg" id="kinds" role="group" aria-label="Show">
      <button aria-pressed="true" data-k="">All</button><button aria-pressed="false" data-k="Request">Requests</button>
      <button aria-pressed="false" data-k="Payment">Payments</button><button aria-pressed="false" data-k="Payout">Payouts</button><button aria-pressed="false" data-k="Refund">Refunds</button>
    </div>
    <input id="q" type="search" placeholder="Search…" aria-label="Search the ledger">
    <span class="chip" id="focus" hidden><span id="focustext"></span><button id="clearfocus" aria-label="Clear">✕</button></span>
    <button class="export" id="export">Export CSV</button>
    <span class="live" id="live">Live</span>
  </div>
  <div class="grid-card" id="gridcard"><div id="grid"></div></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let L = null, api = null, kind = "", view = "activity";

function cash(x) {
  if (x === null || x === undefined || x === "") return "";
  const v = Math.round(Number(x) * 100) / 100, a = Math.abs(v);
  const s = Number.isInteger(a) ? a.toLocaleString("en-US") : a.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (v < 0 ? "−" : "") + (L ? L.currency : "$") + s;
}

const STATUS = {applied: "good", approved: "good", paid: "good", received: "good", success: "good", succeeded: "good",
  pending_owner: "warn", sent: "", unclaimed: "warn", pending: "warn", countered: "warn",
  denied: "bad", declined: "bad", refunded: "muted", reversed: "bad", void: "muted", cancelled: "muted", returned: "muted", reverted: "muted", failed: "bad"};
const LABEL = {pending_owner: "waiting for you", applied: "applied", denied: "refused", sent: "open", void: "cancelled"};
const VERDICT = {ALLOW: ["good", "Allowed"], ESCALATE: ["warn", "Asked you"], DENY: ["bad", "Refused"], OWNER: ["", "Your counter"]};

const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;

const progress = (p) => {
  if (!p.data || p.node.rowPinned) return "";
  const pct = p.data.total ? Math.round(100 * p.data.paid / p.data.total) : 0;
  return `<div class="prog"><i><b style="width:${pct}%"></b></i><span>${pct}%</span></div>`;
};
const money = {type: "rightAligned", valueFormatter: (p) => cash(p.value), filter: "agNumberColumnFilter", enableCellChangeFlash: true};

const VIEWS = {
  activity: {
    rows: () => L.rows, id: (d) => d.id, file: "activity",
    columns: [
      {field: "when", headerName: "When", width: 160, comparator: (a, b, x, y) => (x.data.at || "").localeCompare(y.data.at || "")},
      {field: "kind", headerName: "Type", width: 100, filter: true},
      {field: "invoice", headerName: "Invoice", width: 110, filter: true},
      {field: "client", headerName: "Client / payee", width: 130, filter: true},
      {field: "what", headerName: "What", flex: 2, minWidth: 200, tooltipField: "what", filter: true},
      {field: "verdict", headerName: "Rules", width: 115, filter: true,
       valueFormatter: (p) => p.value ? VERDICT[p.value][1] : "",
       cellRenderer: (p) => p.value ? pill(...VERDICT[p.value]) : ""},
      {field: "status", headerName: "Status", width: 125, enableCellChangeFlash: true, filter: true,
       cellRenderer: (p) => p.value ? pill(STATUS[p.value] ?? "", LABEL[p.value] || p.value.replace(/_/g, " ")) : ""},
      {field: "amount", headerName: "Amount", width: 105, ...money, cellClass: (p) => p.value < 0 ? "neg" : ""},
      {field: "why", headerName: "Why", flex: 2, minWidth: 180, tooltipField: "why", filter: true},
      {field: "undo", headerName: "", width: 80, sortable: false, filter: false, pinned: innerWidth > 640 ? "right" : null, suppressCsvExport: true,
       cellRenderer: (p) => p.value ? `<button class="undo" data-undo="${Number(p.value)}">Undo</button>` : ""},
    ],
    // Only real money moving counts towards the total: requests and invoices are promises.
    total: (rows) => ({when: "Money moved", amount: rows.filter((r) => r.kind === "Payment" || r.kind === "Payout" || r.kind === "Refund").reduce((n, r) => n + r.amount, 0)}),
  },
  invoices: {
    rows: () => L.invoices, id: (d) => d.id, file: "invoices", drill: (d) => show("activity", d.invoice),
    columns: [
      {field: "invoice", headerName: "Invoice", width: 125, filter: true},
      {field: "client", headerName: "Client", width: 170, filter: true},
      {field: "what", headerName: "For", flex: 1, minWidth: 180, filter: true},
      {field: "total", headerName: "Total", width: 115, ...money},
      {field: "paid", headerName: "Paid", width: 115, ...money},
      {field: "balance", headerName: "Left to pay", width: 125, ...money},
      {headerName: "Progress", width: 170, sortable: false, cellRenderer: progress, suppressCsvExport: true},
      {field: "plan", headerName: "Plan", width: 115, filter: true},
      {field: "next_due", headerName: "Next due", width: 130, comparator: (a, b, x, y) => (x.data.due_sort || "9").localeCompare(y.data.due_sort || "9"),
       cellClass: (p) => p.data && p.data.overdue ? "neg" : ""},
      {field: "status", headerName: "Status", width: 110, filter: true,
       cellRenderer: (p) => p.value ? pill(STATUS[p.value] ?? "", LABEL[p.value] || p.value) : ""},
    ],
    total: (rows) => ({invoice: "Total", total: sum(rows, "total"), paid: sum(rows, "paid"), balance: sum(rows, "balance")}),
  },
  clients: {
    rows: () => L.clients, id: (d) => d.id, file: "clients", drill: (d) => show("invoices", d.client),
    columns: [
      {field: "client", headerName: "Client", flex: 1, minWidth: 180, filter: true},
      {field: "invoices", headerName: "Invoices", width: 105, type: "rightAligned", filter: "agNumberColumnFilter"},
      {field: "total", headerName: "Billed", width: 120, ...money},
      {field: "paid", headerName: "Paid", width: 120, ...money},
      {field: "balance", headerName: "Left to pay", width: 125, ...money},
      {headerName: "Collected", width: 170, sortable: false, cellRenderer: progress, suppressCsvExport: true},
      {field: "overdue", headerName: "Overdue", width: 105, type: "rightAligned", filter: "agNumberColumnFilter", cellClass: (p) => p.value ? "neg" : ""},
      {field: "requests", headerName: "Requests", width: 105, type: "rightAligned", filter: "agNumberColumnFilter"},
      {field: "refused", headerName: "Rules refused", width: 125, type: "rightAligned", filter: "agNumberColumnFilter"},
    ],
    total: (rows) => ({client: "Total", invoices: sum(rows, "invoices"), total: sum(rows, "total"), paid: sum(rows, "paid"), balance: sum(rows, "balance"),
                       overdue: sum(rows, "overdue"), requests: sum(rows, "requests"), refused: sum(rows, "refused")}),
  },
};
const sum = (rows, key) => rows.reduce((n, r) => n + (r[key] || 0), 0);

function makeGrid() {
  if (agGrid.ModuleRegistry && agGrid.AllCommunityModule) agGrid.ModuleRegistry.registerModules([agGrid.AllCommunityModule]);
  const theme = agGrid.themeQuartz.withParams({ accentColor: "#0070ba", foregroundColor: "#001c43", borderColor: "#dde4ec", headerBackgroundColor: "#f5f7fa", headerTextColor: "#3f5068", headerFontWeight: 600, headerFontSize: 12, fontSize: 13, cellHorizontalPadding: 12, fontFamily: "Inter, sans-serif" });
  api = agGrid.createGrid($("#grid"), {
    theme, columnDefs: VIEWS[view].columns, rowData: [], getRowId: (p) => p.data.id,
    defaultColDef: {sortable: true, resizable: true, cellDataType: false},
    rowHeight: 40, headerHeight: 38, animateRows: true, tooltipShowDelay: 300,
    isExternalFilterPresent: () => view === "activity" && !!kind, doesExternalFilterPass: (n) => n.data.kind === kind,
    onModelUpdated: updateTotal,
    onRowClicked: (e) => { if (!e.node.rowPinned && VIEWS[view].drill && !e.event.target.closest("button")) VIEWS[view].drill(e.data); },
    overlayNoRowsTemplate: '<span style="color:var(--muted)">Nothing here yet. Send your first invoice from the Invoices page.</span>',
  });
}

function updateTotal() {
  const rows = [];
  api.forEachNodeAfterFilter((n) => rows.push(n.data));
  api.setGridOption("pinnedBottomRowData", rows.length ? [VIEWS[view].total(rows)] : []);
}

function show(next, focus) {
  view = next;
  $("#views").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === view)));
  $("#kinds").hidden = view !== "activity";
  $("#gridcard").classList.toggle("drill", !!VIEWS[view].drill);
  api.setGridOption("columnDefs", VIEWS[view].columns);
  api.resetColumnState();  // each view keeps its own widths, not the last view's
  api.setGridOption("rowData", L ? VIEWS[view].rows() : []);
  setFocus(focus || "");
}

function setFocus(text) {
  $("#focus").hidden = !text;
  $("#focustext").textContent = text;
  $("#q").value = text;
  api.setGridOption("quickFilterText", text);
}

function renderKpis() {
  const k = L.kpis;
  const tiles = [
    ["Outstanding", cash(k.outstanding), "still owed by clients"],
    ["Collected", cash(k.collected), "payments, less refunds"],
    ["Paid out", cash(k.paid_out), "to subcontractors"],
    ["Rules allowed", k.agent_agreed, "within your rules"],
    ["Rules asked you", k.owner_decided, "outside your rules"],
    ["Rules refused", k.blocked, "declined automatically"],
  ];
  $("#kpis").innerHTML = tiles.map(([l, v, h]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${esc(v)}</div><div class="h">${h}</div></div>`).join("");
}

async function undo(pid, btn) {
  btn.disabled = true; btn.textContent = "…";
  await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: "undo #" + pid})});
  refresh();
}

async function refresh() {
  try {
    const r = await fetch("/api/ledger");
    L = await r.json();
    document.title = `${L.business} ledger`;
    $("#now").textContent = L.now + (L.mode === "paypal" ? " · PayPal sandbox" : " · practice mode");
    renderKpis();
    api.setGridOption("rowData", VIEWS[view].rows());
    $("#live").textContent = "Live · updated " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch (e) {
    $("#live").textContent = "Can't reach the server";
  }
}

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-undo]");
  if (b) undo(b.dataset.undo, b);
});
$("#q").addEventListener("input", (e) => { $("#focus").hidden = true; api.setGridOption("quickFilterText", e.target.value); });
$("#clearfocus").addEventListener("click", () => setFocus(""));
$("#views").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.v); });
$("#export").addEventListener("click", () => api.exportDataAsCsv({fileName: `living-pay-${VIEWS[view].file}.csv`}));
$("#kinds").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  kind = b.dataset.k;
  $("#kinds").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  api.onFilterChanged();
});

makeGrid();
refresh();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 4000);
</script>
</body>
</html>
