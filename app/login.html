<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Living Pay</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: linear-gradient(var(--ink), var(--ink)) no-repeat top / 100% calc(12vh + 150px), var(--bg); }
  main { max-width: 400px; margin: 12vh auto 0; padding: 0 16px; }
  .brand { font-size: 22px; color: var(--on-ink); }
  main > p { --ink-2: var(--on-ink-2); font-size: 14px; }
  form { display: grid; gap: 14px; padding: 24px; }
  label { display: grid; gap: 6px; font-weight: 600; }
  button.primary { min-height: 44px; font-size: 15px; }
  #error { color: var(--bad); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand" style="margin-bottom:18px"><img src="/logo.svg" alt="" width="26" height="26">Living Pay</div>
  <p style="margin:-10px 0 18px;color:var(--ink-2)">A real PayPal invoice your clients can talk to.</p>
  <form class="card" id="form">
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <p id="error" role="alert" hidden></p>
    <button class="primary">Sign in</button>
  </form>
</main>
<script>
const error = document.getElementById("error");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  error.hidden = true;
  const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("password").value }) });
  if (r.ok) { location.href = "/"; return; }
  error.textContent = (await r.json()).error;
  error.hidden = false;
});
</script>
</body>
</html>
